.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}

input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
textarea{min-height:76px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--urgent)}
.btn.danger.armed{background:var(--urgent);color:#fff;border-color:var(--urgent)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 2px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--chip)}
/* Liste */
.list{display:flex;flex-direction:column;margin-top:8px}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:hover{background:var(--chip)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted)}
.item .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.glyph{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--f-head)}
.glyph.ligne{border-radius:3px;height:8px;margin-block:9px}
.glyph.zone{border-radius:4px;opacity:.85}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px;line-height:1.5;margin-top:10px}
.empty b{color:var(--ink)}
.geo{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;line-height:1.6;overflow-x:auto}
.photos{display:flex;flex-wrap:wrap;gap:6px}
.photos figure{margin:0;position:relative;width:76px;height:76px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.addph{width:76px;height:76px;border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.addph input{display:none}
.formhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.formhead h2{font-family:var(--f-head);font-size:18px;text-transform:uppercase;margin:0;letter-spacing:.03em}
.meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sect{margin-bottom:20px}
.sect h3{font-family:var(--f-head);font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 8px}
.warn{font-size:13px;line-height:1.5;border-left:3px solid var(--watch);background:var(--chip);padding:8px 10px;border-radius:0 var(--r) var(--r) 0;margin:0 0 10px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.layer span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:center;cursor:pointer}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:20px;font-size:14px;z-index:900;pointer-events:none;max-width:calc(100% - 32px)}
/* Outils sur la carte */
.tools{position:absolute;top:12px;right:12px;z-index:800;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toolbar{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.toolbar button{border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;font-size:14px}
.toolbar button+button{border-left:1px solid var(--line)}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.drawbar{background:var(--ink);color:var(--panel);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:300px}
.drawbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:600}
.drawbar button.go{background:var(--panel);color:var(--ink)}
.coords{position:absolute;left:10px;bottom:10px;z-index:800;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.leaflet-container{background:var(--map);font-family:var(--f-ui)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-scale-line{background:var(--panel);color:var(--ink);border-color:var(--ink)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.pin{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);color:#fff;font:700 12px/22px var(--f-head);text-align:center}
.pin.sel{outline:3px solid var(--ink);outline-offset:1px}
.vtx{width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.gridlbl{font:500 10px var(--f-mono);color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body><div class="app">
  <aside class="panel">
    <div class="head">
      <div class="brand"><h1>Relevés La Bassée<small>Site pilote · EPTB Seine Grands Lacs</small></h1><span class="sync" id="sync">Connexion…</span></div>
      <div class="stats" id="stats"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-rel" aria-selected="true">Relevés</button>
        <button class="tab" role="tab" id="tab-cou" aria-selected="false">Couches</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="tools">
      <div class="toolbar" id="toolbar">
        <button id="t-point" aria-pressed="false" title="Ajouter un point">● Point</button>
        <button id="t-ligne" aria-pressed="false" title="Tracer une ligne">╱ Ligne</button>
        <button id="t-zone" aria-pressed="false" title="Tracer une zone">▱ Zone</button>
      </div>
      <div class="drawbar" id="drawbar" hidden></div>
    </div>
    <div class="basesw" id="basesw">
      <button class="b-sat" data-base="sat" aria-pressed="false">Satellite</button>
      <button class="b-ortho" data-base="ortho" aria-pressed="false">Photo IGN</button>
      <button class="b-plan" data-base="plan" aria-pressed="false">Plan</button>
    </div>
    <button class="locbtn" id="locbtn" title="Ma position" aria-label="Centrer sur ma position" hidden>◎</button>
    <div class="coords" id="coords">Lambert-93 · survole la carte</div>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>

<script src="lib/leaflet.js"></script>
<script src="lib/proj4.js"></script>
<script>
(function(){
"use strict";
/* ---------- Référentiels ---------- */
proj4.defs("EPSG:2154","+proj=lcc +lat_0=46.5 +lon_0=3 +lat_1=49 +lat_2=44 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
const toL93=(lat,lng)=>proj4("EPSG:4326","EPSG:2154",[lng,lat]);
const fromL93=(x,y)=>{const p=proj4("EPSG:2154","EPSG:4326",[x,y]);return [p[1],p[0]];};
const fmt=n=>Math.round(n).toLocaleString("fr-FR");
const CATS=[
  {k:"obs",n:"Observation",l:"O",c:"#3f74c9"},{k:"des",n:"Désordre digue",l:"D",c:"#b8432f"},{k:"ouv",n:"Ouvrage",l:"V",c:"#6a4fb3"},
  {k:"clo",n:"Clôture / barriérage",l:"C",c:"#8a6a2c"},{k:"pz",n:"Piézomètre",l:"P",c:"#1590a8"},{k:"veg",n:"Végétation",l:"G",c:"#3c8a3a"},{k:"aut",n:"Autre",l:"·",c:"#5f6b66"}];
const ETATS=[{k:"ok",n:"Bon"},{k:"watch",n:"À surveiller"},{k:"bad",n:"Dégradé"},{k:"urgent",n:"Urgent"},{k:"info",n:"Info"}];
const catOf=k=>CATS.find(c=>c.k===k)||CATS[6];
const etatOf=k=>ETATS.find(e=>e.k===k)||ETATS[4];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colEtat=k=>css("--"+(etatOf(k).k));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

/* ---------- Application Android (Capacitor) ---------- */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=NATIVE?(window.Capacitor.Plugins||{}):{};
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(b);});
async function nativeSave(blob,type){
  const ext=type==="application/json"?".json":type==="image/png"?".png":".jpg";
  const r=await NP.Filesystem.writeFile({path:"medias/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+ext,data:await blobToB64(blob),directory:"DATA",recursive:true});
  return "nat:"+r.uri;
}

/* ---------- Stockage : base partagée claude.ai, sinon navigateur ---------- */
const local={
  read(c){try{return JSON.parse(localStorage.getItem("bassee_"+c)||"{}")}catch(e){return {}}},
  write(c,o){try{localStorage.setItem("bassee_"+c,JSON.stringify(o));return true}catch(e){toast("Stockage local plein ou bloqué");return false}},
  subs:{}
};
const store={
  mode:"local", db:null, assets:null, user:null, uid:null, canWrite:true,
  subscribe(coll,cb){
    if(this.mode==="db"){
      return this.db.collection(coll).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{setSync("Synchro interrompue");});
    }
    (local.subs[coll]=local.subs[coll]||[]).push(cb);
    const o=local.read(coll);cb(Object.entries(o).map(([id,v])=>({id,...v})));
  },
  _emit(coll){const o=local.read(coll);(local.subs[coll]||[]).forEach(cb=>cb(Object.entries(o).map(([id,v])=>({id,...v}))));},
  async save(coll,id,data){
    if(this.mode==="db"){const ref=id?this.db.collection(coll).doc(id):this.db.collection(coll).doc();await ref.set(data);return ref.id;}
    const o=local.read(coll);id=id||("l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));o[id]=data;
    if(!local.write(coll,o))throw new Error("local");this._emit(coll);return id;
  },
  async remove(coll,id){
    if(this.mode==="db"){await this.db.collection(coll).doc(id).delete();return;}
    const o=local.read(coll);delete o[id];local.write(coll,o);this._emit(coll);
  },
  async putFile(blob,type){
    if(this.mode==="db"&&this.assets){const r=await this.assets.upload(blob,type?{type}:undefined);return r.id;}
    if(NATIVE&&NP.Filesystem)return await nativeSave(blob,type);
    return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
  },
  fileUrl(ref){if(!ref)return "";if(ref.startsWith("data:"))return ref;if(ref.startsWith("nat:"))return window.Capacitor.convertFileSrc(ref.slice(4));return "/_blob/"+ref;}
};
function setSync(t){$("sync").textContent=t;}

/* ---------- Carte ---------- */
const map=L.map("map",{zoomControl:true,doubleClickZoom:false,preferCanvas:false}).setView([48.408,3.098],14);
L.control.scale({imperial:false,position:"bottomright"}).addTo(map);
const wmts=layer=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${layer.includes("ORTHO")?"image/jpeg":"image/png"}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const esri=p=>`https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
const BASES={
  sat:L.layerGroup([
    L.tileLayer(esri("World_Imagery"),{maxNativeZoom:18,maxZoom:20,attribution:"Imagerie © Esri, Maxar, Earthstar Geographics"}),
    L.tileLayer(esri("Reference/World_Boundaries_and_Places"),{maxNativeZoom:18,maxZoom:20})]),
  ortho:L.tileLayer(wmts("ORTHOIMAGERY.ORTHOPHOTOS"),{maxNativeZoom:19,maxZoom:20,attribution:"© IGN Géoplateforme"}),
  plan:L.tileLayer(wmts("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2"),{maxNativeZoom:19,maxZoom:20,attribution:"© IGN Géoplateforme"}),
  none:null
};
let baseKey="sat",tilesBlocked=false,tileOk=false;
function setBase(k){Object.values(BASES).forEach(l=>l&&map.removeLayer(l));baseKey=k;if(BASES[k]){BASES[k].addTo(map);}
  document.querySelectorAll("#basesw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.base===k));
  try{localStorage.setItem("bassee_base",k)}catch(e){}
  if(state.tab==="cou")renderBody();}
const tileLayers=[];Object.values(BASES).forEach(l=>{if(!l)return;(l.eachLayer?(()=>{const a=[];l.eachLayer(x=>a.push(x));return a;})():[l]).forEach(t=>tileLayers.push(t));});
tileLayers.forEach(l=>{l.options.zIndex=1;
  l.on("tileload",()=>{tileOk=true;});
  l.on("tileerror",()=>{if(!tileOk&&!tilesBlocked){tilesBlocked=true;if(state.tab==="cou")renderBody();}});
});
document.querySelectorAll("#basesw button").forEach(b=>b.onclick=()=>setBase(b.dataset.base));

/* Quadrillage kilométrique Lambert-93 */
const gridLayer=L.layerGroup().addTo(map);let gridOn=true;
function drawGrid(){
  gridLayer.clearLayers();if(!gridOn)return;
  const b=map.getBounds(),z=map.getZoom();const step=z>=15?500:z>=13?1000:z>=11?5000:10000;
  const sw=toL93(b.getSouth(),b.getWest()),ne=toL93(b.getNorth(),b.getEast()),nw=toL93(b.getNorth(),b.getWest()),se=toL93(b.getSouth(),b.getEast());
  const x0=Math.floor(Math.min(sw[0],nw[0])/step)*step,x1=Math.max(ne[0],se[0]),y0=Math.floor(Math.min(sw[1],se[1])/step)*step,y1=Math.max(ne[1],nw[1]);
  if((x1-x0)/step>60||(y1-y0)/step>60)return;
  const st={color:css("--muted"),weight:1,opacity:.35,dashArray:"2 4",interactive:false};
  for(let x=x0;x<=x1;x+=step){const pts=[];for(let y=y0;y<=y1+step;y+=step/4)pts.push(fromL93(x,y));L.polyline(pts,st).addTo(gridLayer);
    L.marker(fromL93(x,y1-((y1-y0)*0.02)),{interactive:false,icon:L.divIcon({className:"gridlbl",html:"X "+fmt(x),iconSize:null,iconAnchor:[-3,0]})}).addTo(gridLayer);}
  for(let y=y0;y<=y1;y+=step){const pts=[];for(let x=x0;x<=x1+step;x+=step/4)pts.push(fromL93(x,y));L.polyline(pts,st).addTo(gridLayer);
    L.marker(fromL93(x0+((x1-x0)*0.01),y),{interactive:false,icon:L.divIcon({className:"gridlbl",html:"Y "+fmt(y),iconSize:null,iconAnchor:[0,12]})}).addTo(gridLayer);}
}
map.on("moveend zoomend",drawGrid);drawGrid();
map.on("mousemove",e=>{const p=toL93(e.latlng.lat,e.latlng.lng);$("coords").textContent=`X ${fmt(p[0])}  Y ${fmt(p[1])}  · Lambert-93`;});

/* ---------- État ---------- */
const state={tab:"rel",feats:[],layers:[],fonds:[],edit:null,filter:"",cat:"",mode:null,draft:[],names:{}};
const featLayer=L.featureGroup().addTo(map);
const refLayers={};const fondLayers={};
let draftLayer=null,draftMarks=L.layerGroup().addTo(map);

/* Géométrie : coordonnées stockées à plat [lat,lng,lat,lng,…] */
const pairs=c=>{const o=[];for(let i=0;i<c.length;i+=2)o.push([c[i],c[i+1]]);return o;};
const flat=ll=>ll.flatMap(p=>[+p[0].toFixed(7),+p[1].toFixed(7)]);
function measure(geom,ll){
  const xy=ll.map(p=>toL93(p[0],p[1]));
  if(geom==="ligne"){let d=0;for(let i=1;i<xy.length;i++)d+=Math.hypot(xy[i][0]-xy[i-1][0],xy[i][1]-xy[i-1][1]);return {len:d};}
  if(geom==="zone"){let a=0,d=0;for(let i=0;i<xy.length;i++){const j=(i+1)%xy.length;a+=xy[i][0]*xy[j][1]-xy[j][0]*xy[i][1];d+=Math.hypot(xy[j][0]-xy[i][0],xy[j][1]-xy[i][1]);}return {area:Math.abs(a)/2,len:d};}
  return {xy:xy[0]};
}
const fmtLen=m=>m>=1000?(m/1000).toLocaleString("fr-FR",{maximumFractionDigits:2})+" km":fmt(m)+" m";
const fmtArea=a=>a>=10000?(a/10000).toLocaleString("fr-FR",{maximumFractionDigits:2})+" ha":fmt(a)+" m²";

function pinIcon(f,sel){return L.divIcon({className:"",html:`<div class="pin${sel?" sel":""}" style="background:${colEtat(f.etat)}">${esc(catOf(f.cat).l)}</div>`,iconSize:[26,26],iconAnchor:[13,13]});}
function drawFeats(){
  featLayer.clearLayers();
  visibleFeats().forEach(f=>{
    const ll=pairs(f.c||[]);if(!ll.length)return;const sel=state.edit&&state.edit.id===f.id;let lyr;
    if(f.geom==="point"){lyr=L.marker(ll[0],{icon:pinIcon(f,sel),draggable:sel&&store.canWrite});
      lyr.on("dragend",e=>{const p=e.target.getLatLng();state.edit.c=flat([[p.lat,p.lng]]);renderBody();});}
    else if(f.geom==="ligne")lyr=L.polyline(ll,{color:colEtat(f.etat),weight:sel?6:4,opacity:.95});
    else lyr=L.polygon(ll,{color:colEtat(f.etat),weight:sel?4:2,fillOpacity:sel?.35:.2});
    lyr.on("click",ev=>{if(state.mode)return;L.DomEvent.stop(ev);openEdit(f.id);});
    lyr.bindTooltip(esc(f.titre||catOf(f.cat).n),{direction:"top",offset:[0,-10]});
    lyr.addTo(featLayer);
  });
}
function visibleFeats(){
  const q=state.filter.toLowerCase();
  return state.feats.filter(f=>(!state.cat||f.cat===state.cat)&&(!q||(f.titre+" "+f.note+" "+catOf(f.cat).n).toLowerCase().includes(q)))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

/* ---------- Saisie ---------- */
function setMode(m){
  state.mode=state.mode===m?null:m;state.draft=[];redrawDraft();
  ["point","ligne","zone"].forEach(k=>$("t-"+k).setAttribute("aria-pressed",state.mode===k));
  map.getContainer().style.cursor=state.mode?"crosshair":"";
  renderDrawbar();
}
function renderDrawbar(){
  const d=$("drawbar");if(!state.mode){d.hidden=true;return;}d.hidden=false;
  if(state.mode==="point"){d.innerHTML=`Touche la carte pour placer le point ${state.me?`<button class="go" id="d-me">À ma position</button>`:""}<button id="d-cancel">Annuler</button>`;
    if($("d-me"))$("d-me").onclick=()=>{state.draft=[state.me.slice()];finishDraft();};}
  else{const n=state.draft.length,min=state.mode==="ligne"?2:3;
    const m=n>=2?measure(state.mode,state.draft):null;
    d.innerHTML=`${n} sommet${n>1?"s":""}${m?" · "+(state.mode==="zone"&&n>=3?fmtArea(m.area):fmtLen(m.len)):""}
      ${state.me?`<button id="d-mev" title="Ajouter ma position GPS comme sommet">+ Ma position</button>`:""}<button id="d-undo" ${n?"":"disabled"}>↶</button><button id="d-cancel">Annuler</button><button class="go" id="d-ok" ${n>=min?"":"disabled"}>Terminer</button>`;}
  $("d-cancel").onclick=()=>setMode(state.mode);
  if($("d-undo"))$("d-undo").onclick=()=>{state.draft.pop();redrawDraft();renderDrawbar();};
  if($("d-ok"))$("d-ok").onclick=finishDraft;
  if($("d-mev"))$("d-mev").onclick=()=>{state.draft.push(state.me.slice());redrawDraft();renderDrawbar();};
}
function redrawDraft(){
  if(draftLayer){map.removeLayer(draftLayer);draftLayer=null;}draftMarks.clearLayers();
  if(!state.draft.length)return;
  const st={color:css("--accent"),weight:3,dashArray:"6 5"};
  draftLayer=(state.mode==="zone"&&state.draft.length>=3?L.polygon(state.draft,{...st,fillOpacity:.15}):L.polyline(state.draft,st)).addTo(map);

map.on("click",e=>{

function finishDraft(){

function openEdit(id){

async function addPhotos(files){
  for(const file of files){
    try{const blob=await shrink(file);const ref=await store.putFile(blob,"image/jpeg");state.edit.photos.push(ref);renderBody();}
    catch(e){toast(e&&e.code==="too_large"?"Photo trop lourde":"Photo non enregistrée ("+(e&&e.code||"erreur")+")");}
  }
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{
  const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",.82);};img.onerror=rej;img.src=u;});}

async function saveEdit(){
  const e=state.edit;e.titre=$("f-titre").value.trim();e.note=$("f-note").value.trim();e.cat=$("f-cat").value;e.date=$("f-date").value||e.date;

async function importReleves(file){
  if(!file)return;
  try{const gj=JSON.parse(await file.text());let n=0,skip=0;
    const key=f=>f.geom+"|"+(f.c||[]).slice(0,2).map(v=>(+v).toFixed(6)).join(",")+"|"+(f.titre||"")+"|"+(f.date||"");
    const have=new Set(state.feats.map(key));
    for(const ft of gj.features||[]){const g=ft.geometry,p=ft.properties||{};if(!g)continue;
      let geom,ll;
      if(g.type==="Point"){geom="point";ll=[g.coordinates];}else if(g.type==="LineString"){geom="ligne";ll=g.coordinates;}
      else if(g.type==="Polygon"){geom="zone";ll=g.coordinates[0].slice(0,-1);}else continue;
      const cat=(CATS.find(c=>c.n===p.categorie)||CATS[6]).k,etat=(ETATS.find(s=>s.n===p.etat)||ETATS[4]).k;
      const f={geom,c:flat(ll.map(x=>[x[1],x[0]])),cat,etat,titre:p.intitule||"",note:p.observation||"",date:p.date||"",photos:[],maj:new Date().toISOString(),auteur:store.uid||null};
      if(have.has(key(f))){skip++;continue;}have.add(key(f));
      await store.save("releves",null,f);n++;}
    toast(`${n} relevé${n>1?"s":""} importé${n>1?"s":""}${skip?`, ${skip} déjà présent${skip>1?"s":""}`:""}`);}
  catch(e){toast(e instanceof SyntaxError?"Ce fichier n'est pas un GeoJSON valide":"Import impossible");}
}
function layerRow(l,coll,on){const w=store.canWrite;
  return `<div class="layer"><input type="checkbox" data-toggle="${l.id}" data-coll="${coll}" ${on?"checked":""} aria-label="Afficher ${esc(l.nom)}">
    ${coll==="couches"?`<span class="dot" style="background:${esc(l.couleur)}"></span>`:""}<span>${esc(l.nom)}</span>
    <button class="btn" style="padding:4px 8px" data-zoom="${l.id}" data-coll="${coll}">Voir</button>${w?`<button class="btn danger" style="padding:4px 8px" data-del="${l.id}" data-coll="${coll}">✕</button>`:""}</div>`;}

async function importFond(){
  const v=k=>parseFloat($("i-"+k).value);const xmin=v("xmin"),xmax=v("xmax"),ymin=v("ymin"),ymax=v("ymax"),file=$("i-file").files[0];
  if(![xmin,xmax,ymin,ymax].every(isFinite)||xmin>=xmax||ymin>=ymax){toast("Emprise incomplète ou incohérente");return;}
  if(xmin<100000||xmax>1300000||ymin<6000000||ymax>7200000){toast("Ces valeurs ne ressemblent pas à du Lambert-93");return;}
  if(!file){toast("Choisis une image");return;}
  try{$("i-go").disabled=true;$("i-go").textContent="Import…";
    const ref=await store.putFile(file,file.type==="image/png"?"image/png":"image/jpeg");
    await store.save("fonds",null,{nom:$("i-nom").value.trim()||file.name,img:ref,xmin,xmax,ymin,ymax});toast("Fond importé");}
  catch(e){toast(e&&e.code==="too_large"?"Image trop lourde (20 Mo max)":"Import impossible");renderBody();}
}
const PALETTE=["#7a4fb5","#0f7fb8","#b5476b","#3f8f3a","#a8641b","#2c2c2c"];
async function importGeo(file){
  if(!file)return;
  try{let gj=JSON.parse(await file.text());
    const crs=JSON.stringify(gj.crs||"");let first=null;(function find(c){if(first)return;if(typeof c[0]==="number"){first=c;return;}c.forEach(find);})(
      (gj.features||[gj]).map(f=>(f.geometry||f).coordinates).filter(Boolean));
    const isL93=/2154/.test(crs)||(first&&Math.abs(first[0])>1000);
    if(isL93){const conv=c=>typeof c[0]==="number"?(()=>{const p=proj4("EPSG:2154","EPSG:4326",[c[0],c[1]]);return [+p[0].toFixed(7),+p[1].toFixed(7)];})():c.map(conv);
      (gj.features||[gj]).forEach(f=>{const g=f.geometry||f;if(g&&g.coordinates)g.coordinates=conv(g.coordinates);});delete gj.crs;}
    const blob=new Blob([JSON.stringify(gj)],{type:"application/json"});
    const ref=await store.putFile(blob,"application/json");
    await store.save("couches",null,{nom:file.name.replace(/\.(geo)?json$/i,""),fichier:ref,couleur:PALETTE[state.layers.length%PALETTE.length]});
    toast("Couche importée"+(isL93?" (convertie depuis Lambert-93)":""));}
  catch(e){toast(e instanceof SyntaxError?"Ce fichier n'est pas un GeoJSON valide":"Import impossible ("+(e&&e.code||"erreur")+")");}
}
async function exportGeo(){
  const fc={type:"FeatureCollection",name:"releves_la_bassee",features:state.feats.map(f=>{const ll=pairs(f.c).map(p=>[p[1],p[0]]);
    const geometry=f.geom==="point"?{type:"Point",coordinates:ll[0]}:f.geom==="ligne"?{type:"LineString",coordinates:ll}:{type:"Polygon",coordinates:[[...ll,ll[0]]]};
    return {type:"Feature",geometry,properties:{intitule:f.titre,categorie:catOf(f.cat).n,etat:etatOf(f.etat).n,observation:f.note,date:f.date,nb_photos:(f.photos||[]).length}};})};
  const txt=JSON.stringify(fc,null,1),name="releves_la_bassee_"+new Date().toISOString().slice(0,10)+".geojson";
  if(NATIVE&&NP.Filesystem){
    try{const r=await NP.Filesystem.writeFile({path:name,data:txt,directory:"CACHE",encoding:"utf8"});
      if(NP.Share){await NP.Share.share({title:"Relevés La Bassée",text:"Export des relevés terrain (GeoJSON)",files:[r.uri],dialogTitle:"Envoyer l'export"});}
      else{await NP.Filesystem.writeFile({path:name,data:txt,directory:"DOCUMENTS",encoding:"utf8"});toast("Enregistré dans Documents");}}
    catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("Export impossible");}
    return;}
  const dl=window.claude?await window.claude.use("downloads"):null;
  if(dl){try{await dl.save({filename:name.replace(/\.geojson$/,".json"),data:txt});toast("Export prêt");}catch(e){if(e.code!=="declined")toast("Export impossible ici");}return;}
  if(!window.claude){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/geo+json"}));a.download=name;a.click();return;}
  toast("Export indisponible dans cette vue");
}

/* Couches : chargement */
async function syncFonds(list){
  state.fonds=list;const ids=new Set(list.map(f=>f.id));
  Object.keys(fondLayers).forEach(id=>{if(!ids.has(id)){map.removeLayer(fondLayers[id]);delete fondLayers[id];}});
  list.forEach(f=>{if(fondLayers[f.id])return;const sw=fromL93(f.xmin,f.ymin),ne=fromL93(f.xmax,f.ymax);
    fondLayers[f.id]=L.imageOverlay(store.fileUrl(f.img),[sw,ne],{opacity:1}).addTo(map);fondLayers[f.id].bringToBack();});
  if(state.tab==="cou")renderBody();
}
async function syncCouches(list){
  state.layers=list;const ids=new Set(list.map(l=>l.id));
  Object.keys(refLayers).forEach(id=>{if(!ids.has(id)){map.removeLayer(refLayers[id]);delete refLayers[id];}});
  for(const l of list){if(refLayers[l.id])continue;
    try{const src=store.fileUrl(l.fichier);const gj=src.startsWith("data:")?JSON.parse(decodeURIComponent(escape(atob(src.split(",")[1])))):await (await fetch(src)).json();
      refLayers[l.id]=L.geoJSON(gj,{interactive:true,style:{color:l.couleur,weight:2,fillOpacity:.08},
        pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:l.couleur,weight:2,fillOpacity:.6}),
        onEachFeature:(f,lyr)=>{const p=f.properties||{};const k=Object.keys(p).slice(0,6);if(k.length)lyr.bindPopup(`<b>${esc(l.nom)}</b><br>`+k.map(x=>`${esc(x)} : ${esc(p[x])}`).join("<br>"));}
      }).addTo(map);
      featLayer.bringToFront&&featLayer.eachLayer(x=>x.bringToFront&&x.bringToFront());
    }catch(e){/* fichier illisible : la couche reste listée */}}
  if(state.tab==="cou")renderBody();
}
async function resolveNames(){
  if(!store.user)return;const ids=[...new Set(state.feats.map(f=>f.auteur).filter(Boolean))];if(!ids.length)return;
  try{const ps=await store.user.profiles(ids);ids.forEach(id=>state.names[id]=(ps[id]&&ps[id].name)||"un collègue");}catch(e){}
}

/* ---------- Démarrage ---------- */
function start(){
  store.subscribe("releves",async list=>{state.feats=list;
    if(state.edit&&state.edit.id&&!list.find(f=>f.id===state.edit.id))state.edit=null;
    renderStats();drawFeats();if(state.tab==="rel"&&!state.edit)renderBody();await resolveNames();});
  store.subscribe("fonds",syncFonds);
  store.subscribe("couches",syncCouches);
  renderBody();
}
/* Fond par défaut et position GPS (hors claude.ai, où la localisation est refusée) */
let savedBase="sat";try{savedBase=localStorage.getItem("bassee_base")||"sat";}catch(e){}
setBase(BASES.hasOwnProperty(savedBase)?savedBase:"sat");
let meMarker=null,meCircle=null,watchId=null;
if((NATIVE&&NP.Geolocation)||(!window.claude&&navigator.geolocation)){
  const lb=$("locbtn");lb.hidden=false;
  lb.onclick=async()=>{
    if(watchId!==null&&meMarker){map.setView(meMarker.getLatLng(),Math.max(map.getZoom(),17));return;}
    toast("Recherche de la position…");
    const onPos=p=>{
      const ll=[p.coords.latitude,p.coords.longitude],first=!meMarker;
      if(first){meMarker=L.marker(ll,{interactive:false,icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
        meCircle=L.circle(ll,{radius:p.coords.accuracy,color:css("--sky"),weight:1,fillOpacity:.1,interactive:false}).addTo(map);
        map.setView(ll,Math.max(map.getZoom(),17));toast("Précision ± "+Math.round(p.coords.accuracy)+" m");}
      else{meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(p.coords.accuracy);}
      state.me=ll;if(state.mode)renderDrawbar();
    };
    const onErr=err=>{toast(err&&(err.code===1||/denied/i.test(String(err.message)))?"Localisation refusée : autorise-la dans les réglages":"Position indisponible");watchId=null;};
    const opts={enableHighAccuracy:true,maximumAge:5000,timeout:20000};
    if(NATIVE&&NP.Geolocation){
      try{const perm=await NP.Geolocation.requestPermissions();if(perm&&perm.location==="denied"){onErr({code:1});return;}
        watchId=await NP.Geolocation.watchPosition(opts,(pos,err)=>{if(err)onErr(err);else if(pos)onPos(pos);});}
      catch(e){onErr(e);}
    }else watchId=navigator.geolocation.watchPosition(onPos,onErr,opts);
  };
}
(async()=>{
  renderStats();renderBody();
  if(!window.claude||!window.claude.use){setSync(NATIVE?"Sur ce téléphone":"Hors ligne · ce navigateur");start();return;}
  const [db,user,assets]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("assets")]);
  if(!db){setSync(NATIVE?"Sur ce téléphone":"Hors ligne · ce navigateur");start();return;}
  store.mode="db";store.db=db;store.user=user;store.assets=assets;
  if(user){try{store.uid=await user.id();}catch(e){}try{const c=await user.can("data.write");if(c===false)store.canWrite=false;}catch(e){}}
  setSync(store.canWrite?"Partagé · en ligne":"Lecture seule");
  start();
})();
})();
</script>
</body></html>
